<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220">
  <!-- DATA SHARD v2 (오리지널, 정면) — 얇은 스모크 글라스 슬래브 + 비치는 붉은 회로 -->
  <!-- 핀 영역: y 60~160 (높이 100, 중심 110) / 왼쪽 0~92 -->
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1a22"/><stop offset="0.5" stop-color="#140b10"/><stop offset="1" stop-color="#0a0508"/>
    </linearGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a0a16"/><stop offset="1" stop-color="#2a050c"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f96a1"/><stop offset="0.5" stop-color="#e9edf2"/><stop offset="1" stop-color="#9aa1ac"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6370"/><stop offset="0.5" stop-color="#2a2f37"/><stop offset="1" stop-color="#15181d"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/><stop offset="0.56" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.72" stop-color="#ffffff" stop-opacity="0.07"/><stop offset="0.76" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="hazard" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#fcee0a"/><rect width="8" height="16" fill="#111"/>
    </pattern>
    <filter id="glow" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="bodyClip"><path d="M110 18 L930 18 L982 70 L982 150 L930 202 L110 202 L92 184 L92 36 Z"/></clipPath>
  </defs>

  <!-- 접점 핀 (가는 금속 날 8개) -->
  <rect x="58" y="56" width="44" height="108" fill="url(#steel)"/>
  <g fill="url(#pin)">
    <rect x="4" y="60" width="66" height="8" rx="2"/><rect x="4" y="73" width="66" height="8" rx="2"/>
    <rect x="4" y="86" width="66" height="8" rx="2"/><rect x="4" y="99" width="66" height="8" rx="2"/>
    <rect x="4" y="112" width="66" height="8" rx="2"/><rect x="4" y="125" width="66" height="8" rx="2"/>
    <rect x="4" y="138" width="66" height="8" rx="2"/><rect x="4" y="151" width="66" height="8" rx="2"/>
  </g>

  <!-- 본체 (스모크 글라스) -->
  <path d="M110 18 L930 18 L982 70 L982 150 L930 202 L110 202 L92 184 L92 36 Z" fill="url(#glass)"/>
  <g clip-path="url(#bodyClip)">
    <!-- 안쪽 기판 -->
    <path d="M168 42 L700 42 L724 66 L724 154 L700 178 L168 178 Z" fill="url(#pcb)"/>
    <!-- 빛나는 회로 -->
    <g fill="none" stroke="#ff2a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <path d="M150 110 L232 110 L252 90 L360 90 L376 74 L470 74"/>
      <path d="M150 128 L262 128 L282 148 L420 148 L436 132 L560 132 L578 114 L700 114"/>
      <path d="M150 92 L200 92 L216 60 L300 60"/>
      <path d="M470 74 L520 74 L540 94 L560 94"/>
      <path d="M420 148 L436 164 L640 164"/>
    </g>
    <g fill="#ffd0d8" filter="url(#glow)">
      <circle cx="470" cy="74" r="4.5"/><circle cx="300" cy="60" r="4"/><circle cx="700" cy="114" r="4.5"/><circle cx="640" cy="164" r="4"/><circle cx="560" cy="94" r="4"/>
    </g>
    <!-- 코어 다이 -->
    <rect x="588" y="58" width="64" height="64" rx="5" fill="#0b0d11" stroke="#3a3f48" stroke-width="2"/>
    <rect x="602" y="72" width="36" height="36" rx="3" fill="#131820" stroke="#5ef6ff" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="620" cy="90" r="5" fill="#5ef6ff" filter="url(#glow)"/>
    <!-- 노란 경고 띠 -->
    <rect x="112" y="18" width="34" height="184" fill="url(#hazard)" opacity="0.92"/>
    <!-- 오른쪽 라벨 영역 -->
    <rect x="752" y="44" width="180" height="2" fill="#5b6370"/>
    <rect x="752" y="174" width="180" height="2" fill="#5b6370"/>
    <text x="756" y="84" font-family="Consolas, Menlo, monospace" font-weight="700" font-size="30" fill="#e9edf2" letter-spacing="4">SHARD</text>
    <text x="756" y="110" font-family="Consolas, Menlo, monospace" font-size="15" fill="#8f96a1" letter-spacing="2">0x2077-JI // NC</text>
    <g fill="#8f96a1"><rect x="756" y="128" width="3" height="28"/><rect x="762" y="128" width="1.5" height="28"/><rect x="767" y="128" width="4" height="28"/><rect x="775" y="128" width="1.5" height="28"/><rect x="780" y="128" width="3" height="28"/><rect x="787" y="128" width="1.5" height="28"/><rect x="792" y="128" width="5" height="28"/><rect x="800" y="128" width="2" height="28"/><rect x="806" y="128" width="3" height="28"/></g>
    <circle cx="930" cy="142" r="8" fill="#062a2e"/><circle cx="930" cy="142" r="4.5" fill="#5ef6ff" filter="url(#glow)"/>
    <!-- 유리 반사 -->
    <rect x="92" y="18" width="890" height="184" fill="url(#sheen)"/>
  </g>
  <!-- 테두리 베벨 -->
  <path d="M110 18 L930 18 L982 70 L982 150 L930 202 L110 202 L92 184 L92 36 Z" fill="none" stroke="#6b737f" stroke-width="2.5"/>
  <path d="M112 22 L928 22 L976 70" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
  <!-- 손잡이 홈 -->
  <g fill="#05030a"><path d="M846 18 L870 18 L866 30 L850 30 Z"/><path d="M880 18 L904 18 L900 30 L884 30 Z"/><path d="M846 202 L870 202 L866 190 L850 190 Z"/><path d="M880 202 L904 202 L900 190 L884 190 Z"/></g>
</svg>
