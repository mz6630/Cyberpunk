<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220">
  <!-- DATA SHARD v3 (오리지널, 정면) — 사이트 HUD 스타일: 어두운 판 · 시안 선 · 노란 라벨 · 안쪽 0/1 데이터 -->
  <!-- 핀 영역: y 60~160 (높이 100, 중심 110) / 왼쪽 0~86 -->
  <defs>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="field"><path d="M132 104 L692 104 L712 124 L712 184 L132 184 Z"/></clipPath>
  </defs>

  <!-- 접점 핀 -->
  <g fill="#9fb0b5">
    <rect x="6" y="60" width="74" height="7"/><rect x="6" y="73" width="74" height="7"/>
    <rect x="6" y="86" width="74" height="7"/><rect x="6" y="99" width="74" height="7"/>
    <rect x="6" y="112" width="74" height="7"/><rect x="6" y="125" width="74" height="7"/>
    <rect x="6" y="138" width="74" height="7"/><rect x="6" y="151" width="74" height="7"/>
  </g>
  <g fill="#5ef6ff"><rect x="6" y="60" width="3" height="98"/></g>

  <!-- 칼라 -->
  <path d="M80 48 L112 48 L112 172 L80 172 Z" fill="#0b0d12" stroke="#5ef6ff" stroke-width="2"/>
  <g fill="#fcee0a"><rect x="88" y="58" width="16" height="4"/><rect x="88" y="158" width="16" height="4"/></g>

  <!-- 본체 (각진 HUD 판) -->
  <path d="M112 18 L560 18 L578 32 L760 32 L778 18 L920 18 L982 80 L982 140 L920 202 L112 202 Z" fill="#0b0d12"/>
  <path d="M112 18 L560 18 L578 32 L760 32 L778 18 L920 18 L982 80 L982 140 L920 202 L112 202 Z" fill="none" stroke="#5ef6ff" stroke-width="2.5" filter="url(#glow)"/>
  <path d="M124 30 L552 30 L570 44 L768 44 L786 30 L914 30 L970 84 L970 136 L914 190 L124 190 Z" fill="none" stroke="#5ef6ff" stroke-opacity="0.25" stroke-width="1"/>

  <!-- 노란 라벨 -->
  <path d="M132 40 L392 40 L406 54 L406 88 L132 88 Z" fill="#fcee0a"/>
  <text x="146" y="78" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-weight="700" font-size="36" fill="#0b0d12" letter-spacing="6">SHARD</text>
  <text x="338" y="80" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-weight="700" font-size="14" fill="#0b0d12">.01</text>
  <text x="420" y="60" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14" fill="#5ef6ff" letter-spacing="2">SYS://NEURAL_LINK</text>
  <text x="420" y="82" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14" fill="#9fb0b5" letter-spacing="2">0x2077 // NC-JI</text>

  <!-- 데이터 필드: 인물과 같은 빨간 0/1 -->
  <path d="M132 104 L692 104 L712 124 L712 184 L132 184 Z" fill="#12060a" stroke="#ff2b4d" stroke-opacity="0.45" stroke-width="1.2"/>
  <g clip-path="url(#field)" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" letter-spacing="1.5">
    <text x="140" y="121" fill="#ff4a66">0110100111010010110101110010100111011010010110101100101101001011010</text>
    <text x="140" y="137" fill="#d8193d" opacity="0.85">1011001011010011100101101001011010110010110100101101011001011010110</text>
    <text x="140" y="153" fill="#ff4a66" opacity="0.7">0100101101011001011010010110100101101001110100101100101101001011010</text>
    <text x="140" y="169" fill="#93102b">1101001011010010110101100101101001011010010110101001011010110100101</text>
    <text x="140" y="183" fill="#93102b" opacity="0.6">0010110100101101001011010110010110100101101001011010010110101100101</text>
  </g>
  <!-- 스캔 커서 -->
  <rect x="500" y="106" width="3" height="76" fill="#5ef6ff" opacity="0.7" filter="url(#glow)"/>

  <!-- 오른쪽: 상태 -->
  <text x="736" y="124" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#9fb0b5" letter-spacing="2">STATUS</text>
  <text x="736" y="146" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-weight="700" font-size="17" fill="#5ef6ff" letter-spacing="2">READY_</text>
  <g fill="#5ef6ff" opacity="0.8">
    <rect x="736" y="160" width="14" height="8"/><rect x="754" y="160" width="14" height="8"/><rect x="772" y="160" width="14" height="8"/><rect x="790" y="160" width="14" height="8" opacity="0.3"/><rect x="808" y="160" width="14" height="8" opacity="0.3"/>
  </g>
  <!-- 끝 그립: 사선 홈 -->
  <g stroke="#fcee0a" stroke-width="4" opacity="0.9">
    <line x1="884" y1="78" x2="904" y2="58"/><line x1="884" y1="98" x2="914" y2="68"/><line x1="884" y1="118" x2="924" y2="78"/>
    <line x1="884" y1="138" x2="934" y2="88"/><line x1="884" y1="158" x2="944" y2="98"/>
  </g>
  <rect x="938" y="128" width="12" height="12" fill="#5ef6ff" filter="url(#glow)"/>

  <!-- 모서리 브래킷 -->
  <g fill="none" stroke="#fcee0a" stroke-width="3">
    <path d="M118 36 L118 24 L130 24"/><path d="M118 184 L118 196 L130 196"/>
  </g>
</svg>
