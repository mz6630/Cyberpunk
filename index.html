<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NIGHT CITY : JACK IN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Barlow+Condensed:wght@600&family=Noto+Sans+KR:wght@400;700;900&display=swap">
  <link rel="stylesheet" href="css/intro.css">
</head>
<body>
  <!-- INTRO : 영상(intro.mp4) 타이밍을 그대로 재현한 캔버스 인트로 -->
  <div id="intro" aria-label="인트로">
    <canvas id="intro-canvas"></canvas>

    <!-- 칩 스테이지: 인트로 뒤 붉은 화면에서 칩을 포트에 꽂으면 메인으로 -->
    <div id="stage" hidden>
      <div id="port" aria-hidden="true">
        <div class="port-body">
          <div class="port-leds"><i></i><i></i><i></i><i></i></div>
          <div class="port-grill"></div>
          <div class="port-slot"></div>
        </div>
        <p class="port-label">NEURAL PORT<span>SLOT 01 // AWAITING SHARD</span></p>
      </div>
      <div id="guide" aria-hidden="true"><span></span></div>
      <button id="chip" type="button" aria-label="칩을 포트에 꽂기">
        <img src="assets/chip.png" alt="" draggable="false">
      </button>
      <p id="stage-hint">DRAG THE SHARD INTO THE PORT<span>칩을 끌어서 포트에 꽂으세요 · Enter</span></p>
    </div>
    <!-- 카프리 스파크 레이어 (칩·포트 위를 덮음) -->
    <canvas id="fx-canvas" aria-hidden="true"></canvas>
  </div>

  <button id="sound" type="button" aria-pressed="true" hidden>SOUND ON</button>

  <!-- 인트로가 끝나면 나타나는 메인 영역 (허브는 다음 단계에서 제작) -->
  <main id="site" hidden>
    <!-- 칩 속 AI의 눈: 마우스를 따라 보고, 깜빡이고, 화면 밖 사용자에게 반응 -->
    <canvas id="eyes-canvas" role="img" aria-label="칩 속에서 깨어난 AI의 두 눈. 마우스를 따라 움직입니다."></canvas>
    <div class="site-ui">
      <p class="eyebrow">SYS://CONNECTION_ESTABLISHED</p>
      <h1>NIGHT CITY <span>: JACK IN</span></h1>
    </div>
    <button id="replay" type="button">인트로 다시 보기</button>
  </main>

  <script src="js/sfx.js"></script>
  <script src="js/eyes.js"></script>
  <script src="js/intro.js"></script>
</body>
</html>
